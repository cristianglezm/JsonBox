name: fuzz

on:
  workflow_dispatch:
    inputs:
      smoke_seconds:
        description: "Seconds to run each fuzz harness"
        required: false
        default: "60"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Configure + build fuzz harnesses
        run: |
          mkdir build && cd build
          CXX=clang++ CC=clang cmake -GNinja -DJsonBox_BUILD_FUZZERS=ON -DJsonBox_BUILD_EXAMPLES=OFF ..
          cmake --build . -j 4

      # libFuzzer adds the inputs it finds to the corpus directory, so each run gets a copy
      - name: Fuzz -- parser (smoke run)
        run: |
          cp -r test/fuzz/corpus build/corpus_parse
          build/fuzz/bin/fuzz_parse -max_total_time=${{ inputs.smoke_seconds }} -timeout=10 -artifact_prefix=build/fuzz/ build/corpus_parse

      - name: Fuzz -- writer round trip (smoke run)
        run: |
          cp -r test/fuzz/corpus build/corpus_roundtrip
          build/fuzz/bin/fuzz_roundtrip -max_total_time=${{ inputs.smoke_seconds }} -timeout=10 -artifact_prefix=build/fuzz/ build/corpus_roundtrip

      - name: Upload any newly-found crashes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes
          path: |
            build/fuzz/crash-*
            build/fuzz/timeout-*
            build/fuzz/oom-*
          if-no-files-found: ignore
